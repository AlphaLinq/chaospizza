name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: paradoxum-games/setup-rokit@v3
        with:
          cache: true
      - name: Install Luau CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/luau"
          gh release download 0.740 --repo luau-lang/luau --pattern 'luau-ubuntu.zip' --dir "$RUNNER_TEMP/luau"
          unzip "$RUNNER_TEMP/luau/luau-ubuntu.zip" -d "$RUNNER_TEMP/luau"
          chmod +x "$RUNNER_TEMP/luau/luau"
          echo "$RUNNER_TEMP/luau" >> "$GITHUB_PATH"
      - run: stylua --check src tests
      - run: selene src
      - run: luau tests/run.luau
      - name: Economy simulation (advisory)
        continue-on-error: true
        run: |
          luau tools/economy_sim.luau > "$RUNNER_TEMP/economy.md"
          diff -q docs/ECONOMY.md "$RUNNER_TEMP/economy.md" || echo '::warning::Regenerate docs/ECONOMY.md after Config changes.'
      - run: rojo build -o "$RUNNER_TEMP/build.rbxlx"
  types:
    runs-on: ubuntu-latest
    # Advisory until the existing project diagnostics have been triaged.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: paradoxum-games/setup-rokit@v3
        with:
          cache: true
      - name: Install luau-lsp and Roblox definitions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/luau-lsp"
          gh release download 1.70.1 --repo JohnnyMorganz/luau-lsp --pattern 'luau-lsp-linux-x86_64.zip' --dir "$RUNNER_TEMP/luau-lsp"
          unzip "$RUNNER_TEMP/luau-lsp/luau-lsp-linux-x86_64.zip" -d "$RUNNER_TEMP/luau-lsp"
          chmod +x "$RUNNER_TEMP/luau-lsp/luau-lsp"
          echo "$RUNNER_TEMP/luau-lsp" >> "$GITHUB_PATH"
          curl --fail --location --retry 3 https://luau-lsp.pages.dev/type-definitions/globalTypes.d.luau -o "$RUNNER_TEMP/roblox.d.luau"
      - name: Generate Rojo sourcemap
        run: rojo sourcemap default.project.json --output sourcemap.json
      - name: Analyze with Roblox types
        id: analyze
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          luau-lsp analyze --platform=roblox --definitions:@roblox="$RUNNER_TEMP/roblox.d.luau" --sourcemap=sourcemap.json src 2>&1 | tee "$RUNNER_TEMP/type-analysis.txt"
      - name: Report advisory diagnostics
        if: always() && steps.analyze.outcome == 'failure'
        run: echo '::warning::Luau type analysis reported diagnostics. See the type-analysis artifact and docs/HANDOFF.md.'
      - name: Upload type diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: type-analysis
          path: ${{ runner.temp }}/type-analysis.txt
          if-no-files-found: ignore
